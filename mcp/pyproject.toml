[project]
name = "landible-mcp"
version = "0.1.0"
description = "FastMCP server exposing a self-hosted audiobook + ebook stack (Chaptarr, qbittorrent-mam, Audiobookshelf) as MCP tools."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10,<4",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landible_mcp"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# The classic default set (pyflakes + the non-style pycodestyle checks), pinned
# so a newer ruff widening its defaults doesn't flag the existing style.
select = ["E4", "E7", "E9", "F"]
