[project]
name = "landible-deploy"
version = "0.1.0"
description = "Landible deploy shim — git-push-driven redeploy, health rollup, and webhook relay."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["."]
